name: Fantasy autopilot

on:
  schedule:
    # Every 15 minutes from about 11am to midnight US Eastern (times are UTC).
    - cron: "*/15 15-23 * * *"
    - cron: "*/15 0-3 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

concurrency:
  group: autopilot        # never let two runs submit moves at the same time
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python autopilot.py --config config.toml
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Set the repository variable AUTOPILOT_LIVE to 1 once dry runs look right.
          AUTOPILOT_LIVE: ${{ vars.AUTOPILOT_LIVE }}
